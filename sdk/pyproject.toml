[project]
name = "loopview-sdk"
version = "0.2.0"
description = "Connect any agent to loopview in one call, and see steps the moment they start."
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "YasmineZerai", email = "zeraiyasmine7@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "opentelemetry-sdk>=1.20",
    # connect(): the standard OTLP/HTTP exporter, so users need nothing else.
    "opentelemetry-exporter-otlp-proto-http>=1.20",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"
