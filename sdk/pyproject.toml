[project]
name = "loopview-sdk"
version = "0.2.0"
description = "Connect any agent to loopview in one call, and see steps the moment they start."
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "YasmineZerai", email = "zeraiyasmine7@gmail.com" }
]
requires-python = ">=3.11"
keywords = ["ai-agents", "llm", "opentelemetry", "observability", "debugging", "tracing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Debuggers",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "opentelemetry-sdk>=1.20",
    # connect(): the standard OTLP/HTTP exporter, so users need nothing else.
    "opentelemetry-exporter-otlp-proto-http>=1.20",
]

[project.urls]
Homepage = "https://github.com/YasmineZerai/loopview"
Documentation = "https://github.com/YasmineZerai/loopview#connect-your-agent"
Issues = "https://github.com/YasmineZerai/loopview/issues"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"
