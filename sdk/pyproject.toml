[project]
name = "loopview-sdk"
version = "0.1.0"
description = "Optional: report span starts to loopview for true real-time agent graphs."
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "YasmineZerai", email = "zeraiyasmine7@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "opentelemetry-sdk>=1.20",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"
