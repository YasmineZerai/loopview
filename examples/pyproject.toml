[project]
name = "loopview-examples"
version = "0.1.0"
description = "Example agents for loopview, one per framework, plus the flagship demo."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.9.0",
    "langchain-anthropic>=1.7.5",
    "langgraph>=1.2.12",
    "loopview",
    "loopview-sdk",
    "openinference-instrumentation-langchain>=0.1.76",
    "opentelemetry-exporter-otlp-proto-http>=1.45.0",
    "opentelemetry-sdk>=1.45.0",
    "pydantic-ai-slim[anthropic]>=2.52.0",
    "python-dotenv>=1.2.3",
]

[tool.uv]
package = false

[tool.uv.sources]
loopview = { path = "../server", editable = true }
loopview-sdk = { path = "../sdk", editable = true }
