[project]
name = "loopview"
version = "0.1.1"
description = "Watch your AI agents run as a live graph, from any OpenTelemetry trace."
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "YasmineZerai", email = "zeraiyasmine7@gmail.com" }
]
requires-python = ">=3.11"
keywords = ["ai-agents", "llm", "opentelemetry", "observability", "debugging", "tracing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Debuggers",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "opentelemetry-proto>=1.45",
]

[project.urls]
Homepage = "https://github.com/YasmineZerai/loopview"
Demo = "https://yasminezerai.github.io/loopview/"
Documentation = "https://github.com/YasmineZerai/loopview#readme"
Issues = "https://github.com/YasmineZerai/loopview/issues"

[project.scripts]
loopview = "loopview.cli:main"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "opentelemetry-exporter-otlp-proto-http>=1.45",
    "opentelemetry-sdk>=1.45",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
